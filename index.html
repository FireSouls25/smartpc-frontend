<!doctype html>
<html lang="es" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smart PC</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%238839ef'/%3E%3Cg stroke='%23eff1f5' stroke-width='5' stroke-linecap='round'%3E%3Cline x1='21' y1='26' x2='21' y2='38'/%3E%3Cline x1='32' y1='18' x2='32' y2='46'/%3E%3Cline x1='43' y1='26' x2='43' y2='38'/%3E%3C/g%3E%3C/svg%3E"
    />
    <script>
      try {
        var t = localStorage.getItem("smartpc.theme") || "auto";
        if (
          t === "dark" ||
          (t === "auto" && matchMedia("(prefers-color-scheme: dark)").matches)
        )
          document.documentElement.dataset.theme = "dark";
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
